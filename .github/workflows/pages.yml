name: Test and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: node --test tests/*.mjs
      - name: Prepare static files
        if: hashFiles('data/catalog.json') != ''
        run: |
          mkdir -p _site/data
          cp index.html styles.css icon.svg app.js catalogue.mjs .nojekyll _site/
          cp data/catalog.json _site/data/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: hashFiles('data/catalog.json') != ''
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: hashFiles('data/catalog.json') != ''
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact metadata
        if: hashFiles('data/catalog.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json,os,time
          from urllib.request import Request,urlopen
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}/artifacts"
          for attempt in range(6):
              request=Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urlopen(request,timeout=20) as response: artifacts=json.load(response)['artifacts']
              matches=[a for a in artifacts if a['name']==os.environ['ARTIFACT_NAME'] and not a['expired']]
              if len(matches)==1:
                  print('Pages artifact metadata is available.');break
              if len(matches)>1:raise RuntimeError('Duplicate Pages artifacts for this attempt')
              if attempt==5:raise RuntimeError('Pages artifact metadata did not become available')
              time.sleep(5)
          PY
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
        if: hashFiles('data/catalog.json') != ''
